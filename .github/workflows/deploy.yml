name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/ec2-user/app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Load SSH key
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          set -e
          if [ -z "${SSH_KEY_B64:-}" ]; then
            echo "::error::Missing EC2_SSH_KEY_B64 secret. On Mac: base64 < ~/.ssh/magellan_deploy | tr -d '[:space:]' | pbcopy"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            "${EC2_USER}@${EC2_HOST}" "echo SSH_OK"

      - name: Sync frontend build (safe)
        run: |
          set -e
          TARGET="${DEPLOY_PATH}/client"
          ssh -i ~/.ssh/deploy_key "${EC2_USER}@${EC2_HOST}" "mkdir -p '${TARGET}'"
          # No --delete: only add/update built files, do not wipe the client folder
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            ./dist/ "${EC2_USER}@${EC2_HOST}:${TARGET}/"

      - name: Restart web container
        run: |
          ssh -i ~/.ssh/deploy_key "${EC2_USER}@${EC2_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'EOF'
          set -e
          cd "$DEPLOY_PATH"
          test -f docker-compose.yml
          if docker compose version >/dev/null 2>&1; then
            docker compose up -d web
            docker compose ps web
          else
            docker-compose up -d web
            docker-compose ps web
          fi
          EOF
