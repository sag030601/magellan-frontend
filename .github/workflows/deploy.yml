name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and build
        run: |
          npm ci
          if [ -n "${{ secrets.VITE_API_URL }}" ]; then
            echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env.production.local
          fi
          npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync build to EC2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          APP_ROOT="${DEPLOY_PATH:-/home/ec2-user/app}"
          TARGET="${APP_ROOT}/client"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            ./dist/ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${TARGET}/"

      - name: Restart web container
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          APP_ROOT="${DEPLOY_PATH:-/home/ec2-user/app}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<EOF
          set -e
          cd "${APP_ROOT}"
          docker compose restart web
          sleep 2
          docker compose ps web
          EOF
