name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/ec2-user/app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Load SSH key
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "${SSH_KEY_B64:-}" ]; then
            echo "$SSH_KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          elif [ -n "${SSH_KEY:-}" ]; then
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "::error::Add EC2_SSH_KEY_B64 secret (recommended) or EC2_SSH_KEY"
            exit 1
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH key loaded OK"

      - name: Test SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            "${EC2_USER}@${EC2_HOST}" "echo SSH_OK"

      - name: Sync frontend build (safe)
        run: |
          set -e
          TARGET="${DEPLOY_PATH}/client"
          ssh -i ~/.ssh/deploy_key "${EC2_USER}@${EC2_HOST}" "mkdir -p '${TARGET}'"
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            ./dist/ "${EC2_USER}@${EC2_HOST}:${TARGET}/"
          echo "Sync complete"

      - name: Restart web
        run: |
          ssh -i ~/.ssh/deploy_key "${EC2_USER}@${EC2_HOST}" bash -s <<EOF
          set -e
          APP='${DEPLOY_PATH}'
          cd "\$APP"
          if docker compose version >/dev/null 2>&1; then
            docker compose up -d web
            docker compose ps web
          else
            docker-compose up -d web
            docker-compose ps web
          fi
          EOF
