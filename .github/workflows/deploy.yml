name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/ec2-user/app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and build
        run: |
          npm ci
          if [ -n "${{ secrets.VITE_API_URL }}" ]; then
            echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env.production.local
          fi
          npm run build

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host key
        run: ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 "${EC2_USER}@${EC2_HOST}" "echo SSH OK && whoami"

      - name: Sync build to EC2
        run: |
          TARGET="${DEPLOY_PATH}/client"
          ssh "${EC2_USER}@${EC2_HOST}" "mkdir -p '${TARGET}'"
          rsync -avz --delete \
            ./dist/ "${EC2_USER}@${EC2_HOST}:${TARGET}/"

      - name: Restart web container
        run: |
          ssh "${EC2_USER}@${EC2_HOST}" "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE="docker-compose"
          else
            echo "ERROR: docker compose not found"
            exit 1
          fi
          $COMPOSE restart web
          sleep 2
          $COMPOSE ps web
          REMOTE
